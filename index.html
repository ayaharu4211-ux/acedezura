<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出面表">
<meta name="application-name" content="出面表">
<meta name="theme-color" content="#23282C">
<title>株式会社エース 出面表</title>
<meta name="description" content="株式会社エース 出面表 - 現場ごとの出勤・休み・経費をリアルタイムで共有します">
<meta property="og:title" content="株式会社エース 出面表">
<meta property="og:description" content="現場ごとの出勤・休み・経費をリアルタイムで共有します">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#F4F5F3; --ink:#23282C; --line:#E3E6E1; --muted:#9AA0A6;
    --green:#2E9E5B; --green-bg:#EDF8F1;
    --red:#D64541; --red-bg:#FCF0EF;
    --card:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{max-width:520px;margin:0 auto;padding:10px 10px 50px}

  .apptitle{
    font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--ink);
    text-align:center;padding:2px 0 8px;
  }
  .head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .head>button{
    width:40px;height:38px;border:none;border-radius:9px;
    background:var(--card);font-size:15px;font-weight:800;color:var(--ink);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .head .date{
    flex:1;text-align:center;font-size:15px;font-weight:800;
    background:var(--card);border-radius:9px;height:38px;
    display:flex;align-items:center;justify-content:center;gap:5px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .head .date small{font-size:11px;color:var(--muted);font-weight:700}

  .statusbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .pill{
    font-size:12px;font-weight:800;border-radius:999px;padding:5px 12px;
    background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);color:var(--muted);
  }
  .pill b{font-size:14px}
  .pill.w{color:var(--green)} .pill.o{color:var(--red)}
  .statusbar .sp{flex:1}
  .statusbar .act{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    font-size:11px;font-weight:700;color:var(--ink);padding:6px 12px;font-family:inherit;
  }

  .group{border-radius:11px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:8px;background:var(--card)}
  .ghead{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 12px;font-size:13px;font-weight:800;
    background:var(--ink);color:#fff;
  }
  .ghead .info{font-size:11px;font-weight:700;opacity:.9;white-space:nowrap}
  .group.off .ghead{background:var(--red)}
  .group.none .ghead{background:#B9BFC4}
  .group.nosite .ghead{background:#6E7A72}

  .prow{
    display:grid;
    grid-template-columns:minmax(52px,68px) 1fr 40px 46px 46px;
    gap:6px;align-items:center;
    padding:6px 8px 6px 10px;
    border-bottom:1px solid var(--line);
  }
  .prow:last-child{border-bottom:none}
  .prow.work{background:var(--green-bg);box-shadow:inset 3px 0 0 var(--green)}
  .prow.off{background:var(--red-bg);box-shadow:inset 3px 0 0 var(--red)}
  .prow .name{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow input.site{
    width:100%;border:none;border-bottom:1px dashed #C6CCC5;background:transparent;
    font-size:12px;padding:3px 1px 4px;outline:none;border-radius:0;color:var(--ink);
    font-family:inherit;min-width:0;
  }
  .prow input.site:focus{border-bottom-color:var(--ink)}
  .prow input.site::placeholder{color:#B9BFB8}

  .st{
    height:38px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--muted);
    font-size:11px;font-weight:800;font-family:inherit;padding:0;
  }
  .st:active{transform:scale(.94)}
  .st.work.on{background:var(--green);border-color:var(--green);color:#fff}
  .st.off.on{background:var(--red);border-color:var(--red);color:#fff}

  .expbtn{
    height:38px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--muted);
    font-size:12px;font-weight:800;font-family:inherit;padding:0;
  }
  .expbtn.has{background:var(--ink);border-color:var(--ink);color:#fff;font-size:10px}
  .expbtn:active{transform:scale(.94)}

  .chips{display:none;flex-wrap:wrap;gap:5px;padding:6px 10px 9px;border-bottom:1px solid var(--line);background:#FAFBF9}
  .chips.show{display:flex}
  .chips button{
    background:#fff;border:1px solid var(--line);border-radius:999px;
    font-size:11px;font-weight:700;color:var(--ink);padding:6px 11px;font-family:inherit;
  }
  .chips .cl{font-size:9px;color:var(--muted);width:100%;font-weight:700}

  .tools{display:flex;justify-content:flex-end}
  .tools button{background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;padding:7px;font-family:inherit}
  .edit-area.hidden{display:none}
  .edit-list{background:var(--card);border-radius:11px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .mrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .name{font-weight:800;font-size:14px}
  .add-row{display:flex;gap:6px;margin-top:6px}
  .add-row input{
    flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;background:var(--card);font-family:inherit;
  }
  .add-row button{
    background:var(--ink);color:#fff;border:none;border-radius:9px;
    padding:0 16px;font-size:13px;font-weight:800;font-family:inherit;
  }
  .del{background:none;border:none;color:var(--red);font-size:11px;text-decoration:underline;padding:5px;font-family:inherit}

  .overlay{
    position:fixed;inset:0;background:rgba(35,40,44,.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .overlay.hidden{display:none}
  .sheet{
    background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;
    padding:16px 14px calc(18px + env(safe-area-inset-bottom));
    max-height:82vh;overflow-y:auto;
  }
  .sheet h3{font-size:15px;font-weight:800;margin-bottom:1px}
  .sheet .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .exp-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
  .exp-item{
    display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
    padding:9px 11px;border-bottom:1px solid var(--line);font-size:13px;
  }
  .exp-item:last-child{border-bottom:none}
  .exp-item .amt{font-weight:800}
  .exp-item.empty{color:var(--muted);grid-template-columns:1fr}
  .exp-total{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 11px;background:#F7F8F6;font-size:13px;font-weight:800;
  }
  .exp-add{display:grid;grid-template-columns:1fr 84px auto;gap:6px;margin-top:2px}
  .exp-add input{
    border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;font-family:inherit;min-width:0;
  }
  .exp-add button{
    background:var(--ink);color:#fff;border:none;border-radius:9px;
    padding:0 14px;font-size:13px;font-weight:800;font-family:inherit;
  }
  .exp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .exp-chips button{
    background:#EEF1ED;border:none;border-radius:999px;
    font-size:11px;font-weight:700;color:var(--ink);padding:7px 12px;font-family:inherit;
  }
  .exp-chips .cl{font-size:9px;color:var(--muted);width:100%;font-weight:700}

  .site-row{
    display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
    padding:11px 12px;border-bottom:1px solid var(--line);
    font-size:14px;font-weight:800;
  }
  .site-row:last-child{border-bottom:none}
  .site-row .sub2{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
  .site-row:active{background:#F7F8F6}
  .hist-day{padding:10px 12px;border-bottom:1px solid var(--line)}
  .hist-day:last-child{border-bottom:none}
  .hist-day .d{font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .hist-day .d .yen{font-size:11px;color:var(--muted);font-weight:700}
  .hist-line{display:flex;gap:6px;align-items:flex-start;margin-top:5px;font-size:12px;line-height:1.5}
  .tag{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap;margin-top:1px}
  .tag.w{background:var(--green);color:#fff}
  .tag.o{background:var(--red);color:#fff}
  .hist-line .nm{flex:1}
  .hist-line.offline .nm{color:var(--muted)}

  .back-btn{
    width:100%;margin-top:14px;background:var(--ink);border:none;color:#fff;
    border-radius:9px;padding:10px;font-size:14px;font-weight:800;font-family:inherit;
  }
  .close-btn{
    width:100%;margin-top:10px;background:transparent;border:1.5px solid var(--ink);
    border-radius:9px;padding:10px;font-size:14px;font-weight:800;color:var(--ink);font-family:inherit;
  }

  .overlay.center{align-items:center;padding:24px}
  .modal{
    background:var(--card);border-radius:14px;width:100%;max-width:320px;
    padding:20px 18px;
  }
  .modal h3{font-size:15px;font-weight:800;color:var(--red);margin-bottom:6px}
  .modal .mtxt{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px}
  .modal input{
    width:100%;border:1.5px solid var(--line);border-radius:9px;
    padding:12px;font-size:20px;text-align:center;letter-spacing:.4em;
    font-family:inherit;color:var(--ink);
  }
  .modal input:focus{border-color:var(--ink);outline:none}
  .merr{display:none;color:var(--red);font-size:11px;font-weight:700;margin-top:7px;text-align:center}
  .modal .mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .mbtn{
    border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:800;
    background:var(--ink);color:#fff;font-family:inherit;
  }
  .mbtn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}

  .live{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
  .live .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.live .dot{animation:none}}

  .setup{background:var(--card);border-radius:12px;padding:20px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .setup h2{font-size:16px;margin-bottom:10px}
  .setup ol{padding-left:20px;font-size:13px;line-height:1.9}
  .setup code{background:var(--bg);padding:2px 6px;border-radius:5px;font-size:12px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">

  <div id="screen-setup" class="hidden">
    <div class="setup">
      <h2>あと少しで使えます</h2>
      <ol>
        <li>このHTMLファイルをテキストエディタで開く</li>
        <li>上部の <code>firebaseConfig</code> をFirebaseからコピーした設定に書き換える</li>
        <li>保存して開き直す</li>
      </ol>
    </div>
  </div>

  <div id="screen-main" class="hidden">
    <div class="apptitle">株式会社エース　出面表</div>
    <div class="head">
      <button onclick="shiftDay(-1)">◀</button>
      <div class="date" id="date-disp" onclick="goToday()">--</div>
      <button onclick="shiftDay(1)">▶</button>
    </div>

    <div class="statusbar">
      <span class="pill w">出勤 <b id="sum-w">0</b></span>
      <span class="pill o">休み <b id="sum-o">0</b></span>
      <span class="pill">未入力 <b id="sum-n">0</b></span>
      <span class="sp"></span>
      <button class="act" onclick="openSites()">現場一覧</button>
    </div>

    <div id="groups"></div>

    <div class="tools"><button onclick="toggleEdit()">メンバーの追加・削除</button></div>
    <div class="edit-area hidden" id="edit-area">
      <div class="edit-list" id="manage-list"></div>
      <div class="add-row">
        <input id="new-name" type="text" placeholder="名前を入力" maxlength="12">
        <button onclick="addMember()">追加</button>
      </div>
    </div>
  </div>
</div>

<!-- 経費モーダル -->
<div class="overlay hidden" id="exp-overlay" onclick="if(event.target===this)closeExp()">
  <div class="sheet">
    <h3 id="exp-title">経費</h3>
    <div class="sub" id="exp-sub">--</div>
    <div class="exp-list">
      <div id="exp-items"></div>
      <div class="exp-total"><span>合計</span><span id="exp-total">0円</span></div>
    </div>
    <div class="exp-add">
      <input id="exp-name" type="text" placeholder="内容(駐車場など)" maxlength="15">
      <input id="exp-amt" type="text" inputmode="numeric" placeholder="金額" maxlength="7">
      <button onclick="addExp()">追加</button>
    </div>
    <div class="exp-chips" id="exp-chips"></div>
    <button class="close-btn" onclick="closeExp()">閉じる</button>
  </div>
</div>

<!-- 現場一覧モーダル -->
<div class="overlay hidden" id="site-overlay" onclick="if(event.target===this)closeSites()">
  <div class="sheet">
    <h3 id="site-title">現場一覧</h3>
    <div class="sub" id="site-sub">タップすると日ごとの履歴が見られます</div>
    <div class="exp-list" id="site-body"></div>
    <button class="back-btn" id="site-back" onclick="backSites()" style="display:none">← 現場一覧に戻る</button>
    <button class="close-btn" onclick="closeSites()">閉じる</button>
  </div>
</div>

<!-- パスワードモーダル -->
<div class="overlay center hidden" id="pass-overlay" onclick="if(event.target===this)closePass()">
  <div class="modal">
    <h3>権限がありません</h3>
    <p class="mtxt">メンバーの追加・削除は管理者のみが行えます。<br>パスワードを入力してください。</p>
    <input id="pass-input" type="tel" inputmode="numeric" maxlength="8" placeholder="････"
      onkeydown="if(event.key==='Enter')submitPass()">
    <div class="merr" id="pass-err">パスワードが違います</div>
    <div class="mrow">
      <button class="mbtn ghost" onclick="closePass()">やめる</button>
      <button class="mbtn" onclick="submitPass()">確認</button>
    </div>
  </div>
</div>

<div class="live" id="live" style="display:none"><span class="dot"></span>リアルタイム同期中　v3</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Firebase設定(設定済み) */
const firebaseConfig = {
  apiKey: "AIzaSyDCP8bb12LQgnm9riXiMGXsDMKYE-DEIPs",
  authDomain: "acededura.firebaseapp.com",
  databaseURL: "https://acededura-default-rtdb.firebaseio.com",
  projectId: "acededura",
  storageBucket: "acededura.firebasestorage.app",
  messagingSenderId: "605106690731",
  appId: "1:605106690731:web:c9bcf8d7e3f1eb5dcf75ee"
};

const $=id=>document.getElementById(id);
const WD=["日","月","火","水","木","金","土"];
function dkey(d){const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function dlabel(key){const[y,m,dd]=key.split("-").map(Number);
  const d=new Date(y,m-1,dd);
  const t=key===dkey(new Date())?" 今日":"";
  return `${m}/${dd} <small>(${WD[d.getDay()]})${t}</small>`;}
function histLabel(k){
  const[y,m,d]=k.split("-").map(Number);
  return `${y}/${m}/${d} (${WD[new Date(y,m-1,d).getDay()]})`;
}

let db=null, members={}, day={}, curKey=dkey(new Date()), dayRef=null;
let expTarget=null, pendingRender=false, chipLock=0;

/* ── 端末ごとの履歴(この端末にだけ保存) ── */
function loadLS(k,def){ try{const v=JSON.parse(localStorage.getItem(k)); return Array.isArray(v)?v:def;}catch(e){return def;} }
function saveLS(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
let siteHist=loadLS("nippou_siteHist",[]);
let expHist=loadLS("nippou_expHist",[]);
function pushHist(arr,v,max,eq,key){
  const i=arr.findIndex(x=>eq(x,v)); if(i>=0)arr.splice(i,1);
  arr.unshift(v); if(arr.length>max)arr.length=max;
  saveLS(key,arr);
}

/* ── 起動 ── */
if(String(firebaseConfig.apiKey).indexOf("ここに")===0 || !firebaseConfig.databaseURL || String(firebaseConfig.databaseURL).indexOf("ここに")===0){
  $("screen-setup").classList.remove("hidden");
}else{
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  $("screen-main").classList.remove("hidden");
  $("live").style.display="block";
  db.ref("members").on("value",s=>{members=s.val()||{};safeRender();renderManage();});
  listenDay(curKey);
}

function listenDay(key){
  curKey=key;
  $("date-disp").innerHTML=dlabel(key);
  if(dayRef)dayRef.off();
  dayRef=db.ref("days/"+key);
  dayRef.on("value",s=>{
    day=s.val()||{};
    safeRender();
    if(expTarget && !$("exp-overlay").classList.contains("hidden")) renderExp();
  });
}

/* 入力中の再描画を避ける */
function safeRender(){
  const ae=document.activeElement;
  if(ae && ae.classList && ae.classList.contains("site")){ pendingRender=true; return; }
  render();
}
document.addEventListener("focusout",()=>{
  setTimeout(()=>{
    if(Date.now()-chipLock<800) return;   // 履歴を選んだ直後は触らない
    if(pendingRender){pendingRender=false;render();}
    document.querySelectorAll(".chips").forEach(c=>c.classList.remove("show"));
  },350);
});

/* 履歴チップのタップ処理(画面が作り直されても効くよう委任方式) */
function onChipTap(e){
  const b=e.target.closest && e.target.closest("button[data-chip]");
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const now=Date.now();
  if(now-chipLock<700) return;   // touchstart と click の二重発火を防ぐ
  chipLock=now;
  if(b.dataset.chip==="site"){
    applySite(b.dataset.mid, b.dataset.val);
  }else{
    pushItem(b.dataset.n, Number(b.dataset.a));
  }
}
document.addEventListener("touchstart", onChipTap, {passive:false});
document.addEventListener("click", onChipTap, true);

function dayRows(){ return day.rows||{}; }
function sorted(){return Object.entries(members).sort((a,b)=>(a[1].order||0)-(b[1].order||0));}
function expArr(rec){ const e=rec&&rec.exp; return Array.isArray(e)?e:(e?Object.values(e):[]); }
function expTotal(rec){return expArr(rec).reduce((s,e)=>s+(Number(e.a)||0),0);}

/* ── 描画 ── */
function render(){
  $("date-disp").innerHTML=dlabel(curKey);
  const rows=dayRows();
  let w=0,o=0,n=0;

  const siteGroups={}; const siteOrder=[];
  const noSite=[], offList=[], noneList=[];
  sorted().forEach(([id,m])=>{
    const rec=rows[id]||{};
    if(rec.s==="work"){
      w++;
      if(rec.site){
        if(!siteGroups[rec.site]){siteGroups[rec.site]=[];siteOrder.push(rec.site);}
        siteGroups[rec.site].push([id,m,rec]);
      }else noSite.push([id,m,rec]);
    }else if(rec.s==="off"){o++;offList.push([id,m,rec]);}
    else {n++;noneList.push([id,m,rec]);}
  });

  $("sum-w").textContent=w;
  $("sum-o").textContent=o;
  $("sum-n").textContent=n;

  const box=$("groups");box.innerHTML="";
  siteOrder.forEach(site=>{
    const list=siteGroups[site];
    const t=list.reduce((s,[,,rec])=>s+expTotal(rec),0);
    box.appendChild(makeGroup(site, list, "", `${list.length}名${t>0?" ・ 経費 "+t.toLocaleString()+"円":""}`));
  });
  if(noSite.length) box.appendChild(makeGroup("現場が未入力", noSite, "nosite", noSite.length+"名"));
  if(offList.length) box.appendChild(makeGroup("休み", offList, "off", offList.length+"名"));
  if(noneList.length) box.appendChild(makeGroup("未入力", noneList, "none", noneList.length+"名"));

  if(sorted().length===0){
    box.innerHTML='<div class="group"><div class="prow" style="grid-template-columns:1fr"><span style="color:var(--muted);font-size:13px">「メンバーの追加・削除」から名前を登録してください</span></div></div>';
  }
}

function makeGroup(title, list, cls, info){
  const g=document.createElement("div");g.className="group "+cls;
  const h=document.createElement("div");h.className="ghead";
  h.innerHTML=`<span>${esc(title)}</span><span class="info">${esc(info)}</span>`;
  g.appendChild(h);
  list.forEach(([id,m,rec])=>{
    g.appendChild(makeRow(id,m,rec));
    const c=document.createElement("div");c.className="chips";c.id="chips-"+id;
    g.appendChild(c);
  });
  return g;
}

function makeRow(id,m,rec){
  const t=expTotal(rec);
  const row=document.createElement("div");
  row.className="prow "+(rec.s==="work"?"work":rec.s==="off"?"off":"");
  row.innerHTML=`
    <span class="name">${esc(m.name)}</span>
    <input class="site" id="site-${id}" type="text" placeholder="現場名" maxlength="20" value="${esc(rec.site||"")}"
      onfocus="showChips('${id}')" onchange="saveSite('${id}',this.value)">
    <button class="expbtn ${t>0?"has":""}" onclick="openExp('${id}')">${t>0?fmtYen(t):"¥"}</button>
    <button class="st work ${rec.s==="work"?"on":""}" onclick="setSt('${id}','work')">出勤</button>
    <button class="st off ${rec.s==="off"?"on":""}" onclick="setSt('${id}','off')">休み</button>`;
  return row;
}
function fmtYen(t){ return t>=10000 ? (t/10000)+"万" : t.toLocaleString(); }

/* ── 現場名の履歴チップ ── */
function showChips(id){
  document.querySelectorAll(".chips").forEach(c=>c.classList.remove("show"));
  const box=$("chips-"+id); if(!box||siteHist.length===0)return;
  box.innerHTML='<span class="cl">履歴からタップで入力</span>';
  siteHist.forEach(v=>{
    const b=document.createElement("button");
    b.type="button";
    b.textContent=v;
    b.dataset.chip="site";
    b.dataset.mid=id;
    b.dataset.val=v;
    box.appendChild(b);
  });
  box.classList.add("show");
}
function applySite(id,v){
  const inp=$("site-"+id);
  if(inp){ inp.value=v; inp.blur(); }
  document.querySelectorAll(".chips").forEach(c=>c.classList.remove("show"));
  pendingRender=false;
  saveSite(id,v);
}

/* ── 保存(Firebaseへ) ── */
function setSt(id,st){
  const cur=dayRows()[id]&&dayRows()[id].s;
  const ref=db.ref(`days/${curKey}/rows/${id}/s`);
  if(cur===st) ref.remove(); else ref.set(st);
}
function saveSite(id,v){
  v=v.trim();
  const up={};
  up[`days/${curKey}/rows/${id}/site`]=v||null;
  const cur=dayRows()[id]||{};
  if(v && !cur.s) up[`days/${curKey}/rows/${id}/s`]="work";
  db.ref().update(up);
  if(v)pushHist(siteHist,v,6,(a,b)=>a===b,"nippou_siteHist");
}

/* ── 経費モーダル ── */
function openExp(id){
  expTarget=id;
  $("exp-title").textContent=(members[id]?members[id].name:"")+" の経費";
  $("exp-sub").textContent=histLabel(curKey);
  $("exp-name").value="";$("exp-amt").value="";
  renderExp();
  $("exp-overlay").classList.remove("hidden");
}
function closeExp(){ $("exp-overlay").classList.add("hidden"); expTarget=null; }
function renderExp(){
  const rec=dayRows()[expTarget]||{};
  const items=expArr(rec);
  const box=$("exp-items");box.innerHTML="";
  if(items.length===0)box.innerHTML='<div class="exp-item empty">まだ経費がありません</div>';
  items.forEach((e,i)=>{
    const div=document.createElement("div");div.className="exp-item";
    div.innerHTML=`<span>${esc(e.n||"(内容なし)")}</span>
      <span class="amt">${Number(e.a).toLocaleString()}円</span>
      <button class="del" onclick="delExp(${i})">削除</button>`;
    box.appendChild(div);
  });
  $("exp-total").textContent=expTotal(rec).toLocaleString()+"円";
  const chips=$("exp-chips");chips.innerHTML="";
  if(expHist.length){
    chips.innerHTML='<span class="cl">履歴からタップで追加</span>';
    expHist.forEach(h=>{
      const b=document.createElement("button");
      b.type="button";
      b.textContent=`${h.n} ${Number(h.a).toLocaleString()}円`;
      b.dataset.chip="exp";
      b.dataset.n=h.n;
      b.dataset.a=h.a;
      chips.appendChild(b);
    });
  }
}
function addExp(){
  const n=$("exp-name").value.trim();
  const a=$("exp-amt").value.replace(/[^0-9]/g,"");
  if(!a){alert("金額を入力してください");return;}
  pushItem(n,Number(a));
  $("exp-name").value="";$("exp-amt").value="";
}
function pushItem(n,a){
  const items=expArr(dayRows()[expTarget]);
  items.push({n:n,a:a});
  db.ref(`days/${curKey}/rows/${expTarget}/exp`).set(items);
  pushHist(expHist,{n:n,a:a},6,(x,y)=>x.n===y.n&&x.a===y.a,"nippou_expHist");
}
function delExp(i){
  const items=expArr(dayRows()[expTarget]);
  items.splice(i,1);
  db.ref(`days/${curKey}/rows/${expTarget}/exp`).set(items.length?items:null);
}

/* ── 現場一覧・日ごとの履歴 ── */
let siteView=null, allDays={};
function openSites(){
  siteView=null;
  $("site-body").innerHTML='<div class="exp-item empty">読み込み中...</div>';
  $("site-overlay").classList.remove("hidden");
  db.ref("days").once("value").then(s=>{allDays=s.val()||{};renderSites();});
}
function closeSites(){ $("site-overlay").classList.add("hidden"); }
function backSites(){ siteView=null; renderSites(); }
function renderSites(){
  const body=$("site-body");
  if(!siteView){
    $("site-title").textContent="現場一覧";
    $("site-sub").textContent="タップすると日ごとの履歴が見られます";
    $("site-back").style.display="none";
    const stats={};
    Object.entries(allDays).forEach(([k,dv])=>{
      Object.values((dv&&dv.rows)||{}).forEach(r=>{
        if(r&&r.site){ if(!stats[r.site])stats[r.site]={}; stats[r.site][k]=true; }
      });
    });
    const list=Object.entries(stats).map(([site,ds])=>{
      const ks=Object.keys(ds).sort();
      return {site:site,count:ks.length,last:ks[ks.length-1]};
    }).sort((a,b)=>b.last.localeCompare(a.last));
    body.innerHTML="";
    if(list.length===0){body.innerHTML='<div class="exp-item empty">まだ現場の記録がありません</div>';return;}
    list.forEach(o=>{
      const div=document.createElement("div");div.className="site-row";
      div.innerHTML=`<span>${esc(o.site)}</span><span class="sub2">${o.count}日 ›</span>`;
      div.onclick=()=>{siteView=o.site;renderSites();};
      body.appendChild(div);
    });
  }else{
    $("site-title").textContent=siteView;
    $("site-sub").textContent="日ごとの履歴(新しい順)";
    $("site-back").style.display="block";
    body.innerHTML="";
    let found=false;
    Object.keys(allDays).sort().reverse().forEach(k=>{
      const rows=(allDays[k]&&allDays[k].rows)||{};
      const workers=[],offs=[];let t=0;
      Object.entries(rows).forEach(([id,r])=>{
        if(!r)return;
        const nm=members[id]?members[id].name:"(削除済み)";
        if(r.site===siteView&&r.s==="work"){workers.push(nm);t+=expTotal(r);}
        else if(r.s==="off")offs.push(nm);
      });
      if(workers.length){
        found=true;
        const div=document.createElement("div");div.className="hist-day";
        div.innerHTML=`
          <div class="d"><span>${histLabel(k)}</span>${t>0?`<span class="yen">経費 ${t.toLocaleString()}円</span>`:""}</div>
          <div class="hist-line"><span class="tag w">出勤 ${workers.length}</span><span class="nm">${esc(workers.join("・"))}</span></div>
          <div class="hist-line offline"><span class="tag o">休み ${offs.length}</span><span class="nm">${offs.length?esc(offs.join("・")):"なし"}</span></div>`;
        body.appendChild(div);
      }
    });
    if(!found)body.innerHTML='<div class="exp-item empty">記録がありません</div>';
  }
}

/* ── 日付 ── */
function shiftDay(n){
  const[y,m,d]=curKey.split("-").map(Number);
  listenDay(dkey(new Date(y,m-1,d+n)));
}
function goToday(){listenDay(dkey(new Date()));}

/* ── メンバー管理(パスワード保護) ── */
const EDIT_PASS="0104";
let editUnlocked=false;
function toggleEdit(){
  const area=$("edit-area");
  if(!area.classList.contains("hidden")){ area.classList.add("hidden"); return; }
  if(!editUnlocked){ askPass(); return; }
  area.classList.remove("hidden"); renderManage();
}
function askPass(){
  $("pass-input").value="";
  $("pass-err").style.display="none";
  $("pass-overlay").classList.remove("hidden");
  setTimeout(()=>$("pass-input").focus(),100);
}
function closePass(){ $("pass-overlay").classList.add("hidden"); }
function submitPass(){
  const v=$("pass-input").value.trim();
  if(v===EDIT_PASS){
    editUnlocked=true;
    closePass();
    $("edit-area").classList.remove("hidden");
    renderManage();
  }else{
    $("pass-err").style.display="block";
    $("pass-input").value="";
    $("pass-input").focus();
  }
}
function renderManage(){
  const box=$("manage-list");if(!box)return;
  box.innerHTML="";
  sorted().forEach(([id,m])=>{
    const row=document.createElement("div");row.className="mrow";
    row.innerHTML=`<span class="name">${esc(m.name)}</span>
      <button class="del" onclick="delMember('${id}')">削除</button>`;
    box.appendChild(row);
  });
}
function addMember(){
  if(!editUnlocked){askPass();return;}
  const el=$("new-name");const name=(el.value||"").trim();
  if(!name)return;
  if(Object.values(members).some(m=>m.name===name)){alert("同じ名前がすでにあります");return;}
  db.ref("members").push({name:name,order:Date.now()});
  el.value="";
}
function delMember(id){
  if(!editUnlocked){askPass();return;}
  const m=members[id];if(!m)return;
  if(confirm(`「${m.name}」を削除しますか?`))db.ref("members/"+id).remove();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
